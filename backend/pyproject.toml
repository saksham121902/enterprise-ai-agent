[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-agent"
version = "1.0.0"
description = "Production-ready Enterprise AI Operations Agent"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Enterprise AI Team"},
]

dependencies = [
    # ── Core Framework ───────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",

    # ── Database & Cache ─────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis[hiredis]>=5.2.0",

    # ── AI / LLM ─────────────────────────────────────────────────────────
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-openai>=0.2.6",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.4",
    "langchain-community>=0.3.5",
    "langgraph>=0.2.45",
    "chromadb>=0.5.15",
    "openai>=1.54.0",
    "anthropic>=0.37.1",
    "google-generativeai>=0.8.3",

    # ── Task Queue ───────────────────────────────────────────────────────
    "celery[redis]>=5.4.0",

    # ── Document Processing ──────────────────────────────────────────────
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.12",

    # ── Security ─────────────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    "argon2-cffi>=23.1.0",
    "bcrypt>=4.2.0",

    # ── Knowledge Graph ──────────────────────────────────────────────────
    "neo4j>=5.26.0",

    # ── Observability ────────────────────────────────────────────────────
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28.0",

    # ── Search ───────────────────────────────────────────────────────────
    "rank-bm25>=0.2.2",

    # ── HTTP Client ──────────────────────────────────────────────────────
    "httpx>=0.27.0",

    # ── Utilities ────────────────────────────────────────────────────────
    "tenacity>=9.0.0",
    "orjson>=3.10.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.4",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "faker>=30.8.0",
    "factory-boy>=3.3.1",
]

# Optional enterprise secret providers
vault = ["hvac>=2.3.0"]
aws = ["boto3>=1.35.0"]
azure = ["azure-identity>=1.19.0", "azure-keyvault-secrets>=4.9.0"]

[tool.setuptools.packages.find]
include = ["app*"]

# ── Ruff ─────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E9",   # syntax errors
    "F63",  # invalid syntax
    "F7",   # undefined names
    "F82",  # undefined variables
    "E",    # pycodestyle errors
    "F",    # pyflakes
]
ignore = [
    "E501",   # line length
    "E402",   # module level import not at top of file
    "F401",   # unused imports
    "F841",   # local variable unused
    "S101",   # assert usage (allowed in tests)
    "COM812", # trailing comma (conflicts with formatter)
    "ISC001", # implicit string concat (conflicts with formatter)
    "B008",   # function call in default argument (used by FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG001", "ARG002"]

# ── Black ────────────────────────────────────────────────────────────────

[tool.black]
target-version = ["py312"]
line-length = 100

# ── MyPy ─────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "chromadb.*",
    "neo4j.*",
    "langchain.*",
    "langchain_core.*",
    "langchain_openai.*",
    "langchain_anthropic.*",
    "langchain_google_genai.*",
    "langchain_community.*",
    "langgraph.*",
    "rank_bm25.*",
    "docx.*",
    "pypdf.*",
    "openpyxl.*",
    "hvac.*",
    "boto3.*",
    "passlib.*",
    "jose.*",
]
ignore_missing_imports = true

# ── Pytest ───────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "agents: Agent behavior tests",
    "slow: Slow-running tests",
]

# ── Coverage ─────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["app"]
omit = [
    "app/migrations/*",
    "tests/*",
    "app/__init__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@abstractmethod",
    "raise NotImplementedError",
]
