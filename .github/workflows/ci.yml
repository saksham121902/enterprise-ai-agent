name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── 1. Backend Linting & Formatting ──────────────────────────────────────
  backend-lint:
    name: Backend Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint Check
        run: |
          ruff check backend/ tests/ --exit-non-zero-on-fix=false

      - name: Run Ruff Format Check
        run: |
          ruff format --check backend/ tests/ || echo "Formatting check advisory"

  # ── 2. Security & Guardrail Unit Tests ────────────────────────────────────
  unit-tests:
    name: Security & Guardrail Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Unit Test Suite
        env:
          LITE_MODE: "true"
          DEMO_MODE: "true"
          PYTHONPATH: "."
        run: |
          python -m tests.run_tests

  # ── 3. Evaluation Suite Benchmark ─────────────────────────────────────────
  evaluation-benchmark:
    name: Evaluation Suite Benchmark (RAG + SQL + Routing)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Evaluation Benchmark
        env:
          LITE_MODE: "true"
          PYTHONPATH: "."
        run: |
          python -m evaluation.run_all

      - name: Upload Evaluation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: |
            evaluation/results.json
            EVALUATION.md

  # ── 4. Frontend Typecheck & Build ─────────────────────────────────────────
  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm run build

  # ── 5. Docker Compose & Configuration Validation ─────────────────────────
  docker-validate:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Lite Configuration
        run: |
          docker compose -f docker-compose.lite.yml config --quiet
          echo "docker-compose.lite.yml syntax is valid"

      - name: Validate Full Docker Compose Configuration
        run: |
          docker compose -f docker-compose.yml config --quiet
          echo "docker-compose.yml syntax is valid"
