# =============================================================================
# Enterprise AI Operations Agent — Docker Compose
# =============================================================================
#
# Usage:
#   docker-compose up                                    # Core only (backend, postgres, redis, chromadb)
#   docker-compose --profile workers up                  # + Celery workers + RabbitMQ
#   docker-compose --profile observability up            # + Prometheus, Grafana, Jaeger, Loki
#   docker-compose --profile neo4j up                    # + Neo4j knowledge graph
#   docker-compose --profile frontend up                 # + React frontend
#   docker-compose --profile full up                     # Everything
#
# =============================================================================

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/enterprise_ai
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CHROMADB_HOST: chromadb
  CHROMADB_PORT: "8000"
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: enterprise_ai_neo4j
  OTLP_ENDPOINT: http://jaeger:4317
  LOG_LEVEL: INFO
  LOG_FORMAT: json
  ENVIRONMENT: development
  DEBUG: "true"

services:
  # ════════════════════════════════════════════════════════════════════════
  # Core Services (always start)
  # ════════════════════════════════════════════════════════════════════════

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "8000:8000"
    environment:
      <<: *backend-env
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/prompts:/app/prompts
      - upload_data:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: enterprise_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════
  # Worker Services (--profile workers)
  # ════════════════════════════════════════════════════════════════════════

  rabbitmq:
    image: rabbitmq:3-management-alpine
    profiles: ["workers", "full"]
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 5

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    profiles: ["workers", "full"]
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=default,documents,embeddings,reports,emails
      --hostname=worker@%h
    environment:
      <<: *backend-env
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: false
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - upload_data:/app/uploads
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    profiles: ["workers", "full"]
    command: >
      celery -A app.workers.celery_app beat
      --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    environment:
      <<: *backend-env
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: false
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════
  # Knowledge Graph (--profile neo4j)
  # ════════════════════════════════════════════════════════════════════════

  neo4j:
    image: neo4j:5-community
    profiles: ["neo4j", "full"]
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/enterprise_ai_neo4j
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════
  # Frontend (--profile frontend)
  # ════════════════════════════════════════════════════════════════════════

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    profiles: ["frontend", "full"]
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════
  # Observability (--profile observability)
  # ════════════════════════════════════════════════════════════════════════

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability", "full"]
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability", "full"]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    profiles: ["observability", "full"]
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    profiles: ["observability", "full"]
    ports:
      - "3100:3100"
    volumes:
      - ./infrastructure/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  chroma_data:
    driver: local
  neo4j_data:
    driver: local
  rabbitmq_data:
    driver: local
  upload_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
